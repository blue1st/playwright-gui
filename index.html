<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playwright Studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="title-bar"></div>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Playwright Studio</h1>
        <div class="sidebar-nav">
          <button id="nav-recordings" class="btn-nav active">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Recordings
          </button>
          <button id="nav-logs" class="btn-nav">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14.5 2 14.5 7.5 20 7.5"/></svg>
            Logs
          </button>
        </div>
        <button id="btn-new-recording" class="btn-new">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-video"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
          Record Action
        </button>
      </div>
      <div id="recordings-list" class="recordings-list">
        <!-- Recordings will be injected here -->
      </div>
      <div class="sidebar-footer">
        <label class="auto-launch-label">
          <input type="checkbox" id="check-auto-launch">
          <span>Auto-launch on startup</span>
        </label>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Recording Editor View -->
      <div id="recording-view" class="content-view">
      <header class="content-header">
        <div class="recording-info">
          <h2 id="current-recording-name">No Recording Selected</h2>
        </div>
        <div class="actions">
          <label class="headless-toggle">
            <input type="checkbox" id="check-headless" checked>
            <span>Headless</span>
          </label>
          <button id="btn-run" class="btn-run">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Play
          </button>
          <button id="btn-save" class="btn-icon" title="Save">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          </button>
          <button id="btn-delete" class="btn-icon" title="Delete">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
          </button>
        </div>
      </header>

      <div class="editor-container">
        <textarea id="editor" spellcheck="false" placeholder="// Select a recording or start a new one..."></textarea>
      </div>

      <div id="schedule-panel" class="schedule-panel" style="display: none; margin-top: auto; border-top: 1px solid var(--border-color);">
        <div class="schedule-header">
          <h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-clock"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.25V14"/><circle cx="16" cy="16" r="6"/></svg> Scheduling</h3>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 0.75rem; color: var(--text-secondary);">Enabled</span>
            <label class="switch">
              <input type="checkbox" id="check-schedule-enabled">
              <span class="slider round"></span>
            </label>
          </div>
        </div>
        <div class="schedule-body">
          <div class="input-group">
            <label>Cron Expression</label>
            <input type="text" id="input-cron" placeholder="*/5 * * * * (Every 5 mins)">
          </div>
          <div class="schedule-preview">
            <label style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px;">Next Run</label>
            <strong id="next-run-preview">Not set</strong>
          </div>
        </div>
      </div>

      <div class="console-container">
        <div class="console-header">Console Output</div>
        <div id="console-output" class="console-output">Ready.</div>
      </div>
      </div>

      <!-- Logs View -->
      <div id="logs-view" class="content-view" style="display: none;">
        <header class="content-header">
          <h2>Execution Logs</h2>
          <div class="actions">
            <button id="btn-open-logs-folder" class="btn-icon" title="Open Folder">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-open"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <button id="btn-refresh-logs" class="btn-icon" title="Refresh">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            </button>
          </div>
        </header>
        <div class="logs-container">
          <table class="logs-table">
            <thead>
              <tr>
                <th>Recording</th>
                <th>Time</th>
                <th>Size</th>
                <th style="width: 100px;">Actions</th>
              </tr>
            </thead>
            <tbody id="logs-list">
              <!-- Logs will be injected here -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- New Recording Modal -->
  <div id="modal-new" class="modal-overlay">
    <div class="modal">
      <h2>New Recording</h2>
      <p style="margin-bottom: 12px; color: var(--text-secondary);">Enter the URL to start recording from:</p>
      <input type="text" id="input-url" value="https://google.com" placeholder="https://...">
      <p style="margin-bottom: 12px; color: var(--text-secondary);">Give it a name:</p>
      <input type="text" id="input-name" placeholder="my-awesome-test">

      <div style="display: flex; gap: 12px; margin-bottom: 12px;">
        <label class="headless-toggle" style="margin: 0;">
          <input type="checkbox" id="check-save-storage">
          <span>Save Session</span>
        </label>
        <label class="headless-toggle" style="margin: 0;">
          <input type="checkbox" id="check-load-storage">
          <span>Load Session</span>
        </label>
      </div>
      <p style="margin-bottom: 12px; color: var(--text-secondary);">Storage filename (optional):</p>
      <input type="text" id="input-storage-name" placeholder="auth.json" value="auth.json" style="margin-bottom: 12px;">
      
      <div style="margin-bottom: 20px;">
        <label class="headless-toggle" style="margin: 0; color: var(--accent-primary); font-weight: 600;">
          <input type="checkbox" id="check-scraping-helper">
          <span>Extraction Helper (Ctrl+Right-click to record elements)</span>
        </label>
      </div>

      <div class="modal-actions">
        <button id="btn-modal-cancel" class="btn-icon" style="padding: 10px 20px;">Cancel</button>
        <button id="btn-modal-start" class="btn-new" style="width: auto; padding: 10px 20px;">Start Recording</button>
      </div>
    </div>
  </div>

  <!-- Log Viewer Modal -->
  <div id="modal-log" class="modal-overlay">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 id="log-viewer-title">Log Content</h2>
        <button id="btn-close-log" class="btn-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="log-content-wrapper">
        <pre id="log-content"></pre>
      </div>
      <div class="modal-actions">
        <button id="btn-log-modal-close" class="btn-new" style="width: auto; padding: 10px 20px;">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="./renderer.js"></script>
</body>
</html>
